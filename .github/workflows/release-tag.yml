name: Release on tag

# IINA installs plugin updates from the latest GitHub release (an .iinaplgz
# asset when there is one), so every version tag gets a release with the
# packed plugin. Uses the workflow token only; no extra secrets needed.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check that Info.json matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          INFO_VERSION=$(python3 -c 'import json; print(json.load(open("Info.json"))["version"])')
          echo "tag=$TAG_VERSION Info.json=$INFO_VERSION"
          test "$TAG_VERSION" = "$INFO_VERSION"

      - name: Install IINA
        run: brew install --cask iina

      - name: Pack plugin
        id: pack
        run: |
          rm -f *.iinaplgz
          /Applications/IINA.app/Contents/MacOS/iina-plugin pack .
          PLUGIN_FILE=$(ls *.iinaplgz)
          echo "asset_path=$PLUGIN_FILE" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.pack.outputs.asset_path }}
